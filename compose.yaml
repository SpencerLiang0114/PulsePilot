services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
  inference:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: muse-spark-1.3
      AGENT_MODE: ${AGENT_MODE:-assist}
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - inference
    restart: unless-stopped
